aid: atombeam
name: AtomBeam
description: >-
  AtomBeam Technologies is a Moraga, California software company founded in 2017 that sells
  "Compaction" — a machine-learning approach to shrinking machine-generated data that replaces
  recurring bit-level patterns with codewords drawn from a trained codebook, rather than
  compressing bytes. Its Neurpac product is an on-premises, protocol-agnostic bidirectional
  compaction tunnel that reduces IoT, telemetry and file payloads by roughly 75% while
  encrypting and obfuscating them in transit; Neurcom and PCM are earlier-stage research
  products. AtomBeam licenses the software to IoT device and gateway makers, satellite and
  LPWAN operators, telcos, and the US Department of Defense, and has raised capital through
  Regulation A and Regulation CF crowdfunding on StartEngine. There is no public developer
  API program: the customer-facing surface is the login-gated AtomBeam Customer Portal
  (codebook generation and simulation) plus a Jira Service Management support portal.
