  reason: customer-only-docs
  detail: >-
    AtomBeam runs a real production API — acg-api.atombeamtech.com, the AWS API Gateway
    backend of its "Codebook Generator" customer portal, whose Angular bundle names the
    codebooks/, datasets/, companies/, simulation/, reports/, users/, categories/,
    notifications/ and tracking/ collections — but it answers 403 Forbidden on every path
    including /openapi.json, and the guides that would document it live inside a Jira
    Service Management portal that 302s to a login; the only public technical collateral
    is a set of Neurpac datasheet PDFs behind email-capture download forms.
